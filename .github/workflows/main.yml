
name: Build Fighter Anime APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q FighterAnime_Android_Project.zip -d project

      - name: Build APK
        run: |
          PROJECT_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Cannot find Android project"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FighterAnime-APK
          path: project/**/build/outputs/apk/debug/*.apk
